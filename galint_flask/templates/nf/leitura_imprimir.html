<!doctype html>
{# NF física (25/11/2026): abre o arquivo lido no Ler NF (PDF ou foto) e chama a impressão do navegador.
   PDF: dentro de um quadro, impresso pelo leitor de PDF do navegador. Foto: ajustada à folha A4. #}
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NF {{ reading.numero_documento or '' }}</title>
    <style>
        html, body { margin: 0; height: 100%; background: #525659; }
        iframe { border: 0; width: 100%; height: 100%; display: block; }
        .foto { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; background: #fff; }
        .foto img { max-width: 100%; height: auto; display: block; }
        @page { size: A4; margin: 8mm; }
        @media print {
            html, body { background: #fff; height: auto; }
            .foto img { max-height: 277mm; object-fit: contain; }
        }
    </style>
</head>
<body>
{% if is_pdf %}
<iframe id="nf" src="{{ file_url }}" title="NF {{ reading.numero_documento or '' }}"></iframe>
<script>
document.getElementById('nf').addEventListener('load', function () {
    var frame = this;
    setTimeout(function () {
        try { frame.contentWindow.focus(); frame.contentWindow.print(); }
        catch (error) { window.location.href = frame.src; }
    }, 400);
});
</script>
{% else %}
<div class="foto"><img id="nf" src="{{ file_url }}" alt="NF {{ reading.numero_documento or '' }}"></div>
<script>
(function () {
    var image = document.getElementById('nf');
    function printNow() { setTimeout(function () { window.print(); }, 200); }
    if (image.complete) printNow(); else image.addEventListener('load', printNow);
})();
</script>
{% endif %}
</body>
</html>
